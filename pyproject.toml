[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poultry-ews"
version = "0.1.0"
description = "Poultry disease early-warning system: flock activity, spatial distribution, mortality and circadian signals from overhead cameras"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.3"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
pews = "poultry_ews.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
poultry_ews = ["api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
